<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }}{% else %}Mark Velednitsky{% endif %}</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}Mark Velednitsky{% endif %}">
  {% if page.description %}<meta property="og:description" content="{{ page.description }}">{% endif %}
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/site.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">Mark Velednitsky</a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/blog/">Blog</a>
      <a href="https://github.com/marvel2010" target="_blank" rel="noopener">GitHub</a>
      <a href="https://scholar.google.com/citations?user=vLcqO88AAAAJ" target="_blank" rel="noopener">Scholar</a>
      <a href="https://www.linkedin.com/in/marvel2010/" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>© {{ site.time | date: "%Y" }} Mark Velednitsky
      · <a href="/blog/">Blog</a>
      · <a href="https://github.com/marvel2010" target="_blank" rel="noopener">GitHub</a>
      · <a href="https://www.linkedin.com/in/marvel2010/" target="_blank" rel="noopener">LinkedIn</a>
    </p>
  </footer>
</body>
</html>
